# SonarCloud — proyecto JADDA SPORTS
# OJO: si cambias este archivo, el job de Sonar (.github/workflows/sonarcloud.yml)
# corre el escaneo con estos parámetros; los paths de cobertura se generan en el
# mismo job antes del escaneo (vitest --coverage de backend y frontend).

sonar.projectKey=yeisonfernandez2022-crypto_Jadda_Sports_React
sonar.organization=yeisonfernandez2022-crypto
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**

# Cobertura REAL generada por vitest (misma corrida, paso previo al escaneo):
#  - backend/vitest.config.mjs  → reporter lcov -> backend/coverage/lcov.info
#  - frontend/vitest.config.ts  → reporter lcov -> frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
