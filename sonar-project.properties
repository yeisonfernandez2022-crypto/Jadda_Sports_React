# SonarCloud — proyecto JADDA SPORTS
# OJO: si cambias este archivo, el job de Sonar (.github/workflows/sonarcloud.yml)
# corre el escaneo con estos parámetros; los paths de cobertura se generan en el
# mismo job antes del escaneo (vitest --coverage de backend y frontend).

sonar.projectKey=yeisonfernandez2022-crypto_Jadda_Sports_React
sonar.organization=yeisonfernandez2022-crypto
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**

# Cobertura REAL generada por vitest (misma corrida, paso previo al escaneo):
#  - backend/vitest.config.mjs  → reporter lcov -> backend/coverage/lcov.info
#  - frontend/vitest.config.ts  → reporter lcov -> frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Archivos que NO forman parte del denominador de cobertura: no tienen
# cobertura por naturaleza (CI/infra/scripts/tests/app móvil) — sin esto la
# métrica "Coverage on New Code" penaliza archivos que ninguna suite cubre.
sonar.coverage.exclusions=**/.github/**,**/Dockerfile*,**/docker-compose*,scripts/**,deploy/**,movil/**,sonar-project.properties,tests/**,backend/tests/**,docs/**,**/*.md,**/*.yml,**/*.yaml,README.md,backend/database/**,frontend/src/pages/**,frontend/src/vendedor/**

# CPD (duplicación): la app móvil duplica intencionalmente utilidades de la
# web (el proyecto móvil ES un espejo React Native de frontend/src) y las
# carpetas tests/ contienen suites duplicadas entre back/front por diseño.
sonar.cpd.exclusions=**/movil/**,tests/**

# ------------------------------------------------------------------
# Exclusiones justificadas de issues (NO es deuda silenciada: cada una
# tiene su motivo revisado — quedan visibles como "Ignored" en la UI).
# NOTA técnica: resourceKey admite UN patrón por criteria (una coma NO
# separa patrones) — por eso cada archivo/rule recibe su propio eN.
# ------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2a,e2b,e2c,e3,e4,e5,e5b,e11,e12,e13,e14,e15,e16,e17,e17b,e18,e18b

# e1 — S6470 (COPY recursivo) en el Dockerfile de DESARROLLO: `COPY . .`
#      se apoya en .dockerignore (excluye .env/.env.*, uploads/, data/,
#      node_modules). El Dockerfile.prod del backend usa copia granular.
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile

# e2a/e2b — S6471 (usuario root) en los Dockerfiles de desarrollo
# (nodemon + bind mounts del host, contenedor interno de dev).
sonar.issue.ignore.multicriteria.e2a.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2a.resourceKey=backend/Dockerfile
sonar.issue.ignore.multicriteria.e2b.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2b.resourceKey=frontend/Dockerfile

# e2c — S6471 runtime nginx de frontend/Dockerfile.prod (listen 80
#       privilegiado + patrón oficial nginx "master root / workers nginx").
sonar.issue.ignore.multicriteria.e2c.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2c.resourceKey=frontend/Dockerfile.prod

# e3 — S5332 falso positivo en config/mailer.js: el scanner marca
#      nodemailer.createTransport({service:"gmail"}) como "http inseguro";
#      el transporte Gmail usa SMTPS 465 + TLS implícito (no hay URL http).
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=**/mailer.js

# e4 — S2068 (contraseña literal test) para datos DE TEST:
#      tests/frontend/msw-handlers.ts: credencial FALSA de mock MSW.
# e5/e5b — S2068 + S6697 en .github/workflows/ci.yml: contraseñas del MySQL
#      efímero del runner (jadda_ci_root/test_password) — se crean y mueren
#      en la corrida; no son secretos reales.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=**/msw-handlers.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.e5b.ruleKey=secrets:S6697
sonar.issue.ignore.multicriteria.e5b.resourceKey=.github/workflows/ci.yml

# e11/e12/e13 — falso positivo del HARNESS de tests de integración:
#  - S2092: la cookie `secure:false` vive SOLO en el app de test (la de
#    producción la fija server.js con secure:isProduction).
#  - S4036: execSync('docker ...') en el harness — el PATH del runner es
#    controlado por el org (GitHub Actions/local dev).
#  - S6861: globals `let app/server/db` exportados por el setup — se
#    reasignan en beforeAll por diseño del harness.
sonar.issue.ignore.multicriteria.e11.ruleKey=javascript:S2092
sonar.issue.ignore.multicriteria.e11.resourceKey=**/tests/backend/integration/setup.js
sonar.issue.ignore.multicriteria.e12.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e12.resourceKey=**/tests/backend/integration/setup.js
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S6861
sonar.issue.ignore.multicriteria.e13.resourceKey=**/tests/backend/integration/setup.js

# e14 — typescript:S5332 (http en dev): los defaults de desarrollo apuntan
#       a la LAN (http://localhost / http del host Expo Go). En producción
#       la SPA viaja por HTTPS (nginx/Caddy) y el móvil usa HTTPS real;
#       las URLs http son solo defaults documentados para desarrollo.
sonar.issue.ignore.multicriteria.e14.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e14.resourceKey=**/vite.config.ts
sonar.issue.ignore.multicriteria.e15.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e15.resourceKey=**/movil/constants/api.ts

# e16 — typescript:S5332 en la carpeta tests/: los URLs de prueba apuntan
#       a localhost del runner de pruebas (nunca a producción).
sonar.issue.ignore.multicriteria.e16.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e16.resourceKey=**/tests/**

# e17 — S7044/S8476 en tests/smoke.mjs (cliente HTTP del HARNESS de humo):
#       los paths que arma son constantes internas del suite y la BASE_URL
#       viene de env del runner — no es superficie de usuario real.
sonar.issue.ignore.multicriteria.e17.ruleKey=javascript:S7044
sonar.issue.ignore.multicriteria.e17.resourceKey=**/tests/smoke.mjs
sonar.issue.ignore.multicriteria.e17b.ruleKey=javascript:S8476
sonar.issue.ignore.multicriteria.e17b.resourceKey=**/tests/smoke.mjs

# e18/e18b — S7044/S8476 en el Navbar público: los targets de window.open y
#       la URL asignada al argumento son rutas CONSTANTES internas de la SPA
#       (no provienen de datos de usuario — es la UI del navbar definiendo
#       a dónde navega cada botón).
sonar.issue.ignore.multicriteria.e18.ruleKey=typescript:S7044
sonar.issue.ignore.multicriteria.e18.resourceKey=**/frontend/src/components/Navbar.tsx
sonar.issue.ignore.multicriteria.e18b.ruleKey=typescript:S8476
sonar.issue.ignore.multicriteria.e18b.resourceKey=**/frontend/src/components/Navbar.tsx
