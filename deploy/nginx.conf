# Nginx: puerta única HTTPS para el stack de producción.
# Termina TLS y redirige TODO al frontend (que a su vez proxea /api y
# /images al backend) — misma origin, sin CORS ni cookies cross-origin.
# Los certificados se montan en /etc/nginx/certs (cert.pem + key.pem).

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # No publicar la versión de nginx (disminuye la superficie de reconocimiento)
  server_tokens off;

  # P9: límite de cuerpo por defecto MÍNIMO (1m) — las rutas de subida se
  # abren a 200m SOLO en su location (mirar server 443). Evita que el borde
  # bufferice cuerpos enormes para el resto del sitio.
  client_max_body_size 1m;

  server {
    listen 80;
    server_name _;
    location / {
      # HTTP -> HTTPS (salvo acme challenges para futuros certificados reales)
      location /.well-known/acme-challenge/ {
        root /var/www;
      }
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad — MISMAS que el Caddyfile de deploy/ para que el
    # stack nginx (certificados propios) y el stack Caddy sean equivalentes.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
      proxy_pass http://frontend:80;   # Fase 3: nginx interno de la SPA (antes vite preview :5173)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Sesiones largas / evidencias en transito
      proxy_read_timeout 120s;
      proxy_request_buffering off;

      # Rutas de SUBIDA (P9): el borde deja pasar cuerpos grandes SOLO para
      # estas rutas (luego el nginx interno de la SPA aplica la MISMA lista —
      # mantener ambas en sincronía):
      # - auth/foto              → base64 del avatar (backend: 10mb)
      # - productos/imagenes     → base64 de fotos de producto (backend: 25mb)
      # - devoluciones(/.*)?     → evidencias multipart (5 x 25 MB)
      # - retos/progreso/[0-9]+  → evidencias multipart + base64 legacy
      location ~ ^/api/(auth/foto|productos/imagenes|devoluciones(/.*)?|retos/progreso/[0-9]+)$ {
        client_max_body_size 200m;
      }
    }
  }
}
