# Nginx: puerta única HTTPS para el stack de producción.
# Termina TLS y redirige TODO al frontend (que a su vez proxea /api y
# /images al backend) — misma origin, sin CORS ni cookies cross-origin.
# Los certificados se montan en /etc/nginx/certs (cert.pem + key.pem).

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Evidencias multipart (5 archivos x 25 MB) + base64 legacy: margen referencial
  client_max_body_size 200m;

  server {
    listen 80;
    server_name _;
    location / {
      # HTTP -> HTTPS (salvo acme challenges para futuros certificados reales)
      location /.well-known/acme-challenge/ {
        root /var/www;
      }
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://frontend:5173;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Sesiones largas / evidencias en transito
      proxy_read_timeout 120s;
      proxy_request_buffering off;
    }
  }
}
