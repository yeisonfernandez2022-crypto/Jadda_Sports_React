# ─────────────────────────────────────────────────────────────────────
#  deploy/nginx.spa.conf — Nginx INTERNO de la SPA (Fase 3 cierre-produccion)
# ─────────────────────────────────────────────────────────────────────
#  Sustituye al `vite preview` como frontend de producción: sirve el dist
#  estático y reproduce el proxy de desarrollo (/api y /images → backend:5000)
#  para que las cookies funcionen same-origin en TODO el tránsito. El nginx
#  de borde (deploy/nginx.conf → 80/443 TLS) apunta a ESTE contenedor, no al nodo.
#
#  Montaje (docker-compose.prod.yml, servicio frontend):
#    ./deploy/nginx.spa.conf:/etc/nginx/conf.d/default.conf:ro
# ─────────────────────────────────────────────────────────────────────

# Fase 4-2 (punto 2): conservar lo que decidió el proxy DE ENTRADA.
# El backend corre con TRUST_PROXY=2 (dos saltos) y espera X-Forwarded-Proto
# de punta (https) y la cadena completa de X-Forwarded-For + X-Real-IP del
# cliente real. Si el borde no mandó el header, $scheme/$remote_addr es el
# valor honesto de este hop.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_real_ip $real_ip_original {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Límite de subida (Fase 4-2, punto 1): fotos de producto en base64 llegan a
    # ~14 MB y las evidencias de retos/devoluciones admiten hasta 100 MB por
    # archivo — sin esta directiva nginx aplica 1 MB y las subidas mueren con 413.
    # Igual que el nginx de borde (deploy/nginx.conf).
    client_max_body_size 200m;

    # Compresión de texto (los assets Vite van con hash + largo caché)
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/csv application/javascript application/json image/svg+xml;

    # Cachés de larga vida para assets con fingerprint (Vite pone hash en el nombre)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Logo y favicon del directorio public (sin hash)
    location = /LogoJadda.png {
        expires 7d;
        try_files $uri =404;
    }
    location = /favicon.ico {
        expires 7d;
        try_files $uri =404;
    }

    # API — proxa al backend (cookies SameSite=Lax same-origin, cabeceras X-Forwarded-*
    # para confiar en el trust proxy del backend).
    # OJO: X-Forwarded-Proto y X-Real-IP se REENVÍAN explícitamente conservando
    # lo que puso el nginx de borde (https + IP real del cliente vía los map $*
    # de arriba). El backend corre con TRUST_PROXY=2 (borde + este hop).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Real-IP         $real_ip_original;

        # Subidas grandes (Fase 4-2, punto 1): sin buffering en disco del proxy
        # y con timeout amplio para la cadena borde→SPA→backend.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Los medios de archivos privados (perfiles/usuarios/devoluciones) los sirve el propio
    # backend con AUTORIZACIÓN (owner/vendedor/admin) — nada de cachearlos aquí.
    location /images/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Igual que /api: conservar la decisión del proxy de entrada.
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Real-IP         $real_ip_original;
    }

    # SPA fallback: cualquier otra ruta (privada /admin/*, /perfil/*…) renderiza
    # el index del router
    location / {
        try_files $uri /index.html;
    }
}
