# ═══════════════════════════════════════════════════════════════════════════
#  frontend/nginx.proxy-backend.conf — snippet del proxy al backend (S04)
# ═══════════════════════════════════════════════════════════════════════════
#  Bloque de proxy COMPARTIDO por las dos locations del nginx interno de la
#  SPA que hablan con el backend:
#    location /api/
#    location ~ ^/api/(auth/foto|productos/imagenes|devoluciones(/.*)?|…)   ← subidas
#  Ambas hacen: include /etc/nginx/snippets/proxy-backend.conf;
#
#  Dockerfile.prod lo copia VERBATIM a /etc/nginx/snippets/ — de propósito
#  NO va en templates/: envsubst arrojaría el resultado a conf.d/ y nginx
#  cargaría ese archivo en CONTEXTO HTTP, donde proxy_pass/proxy_set_header
#  no son válidos (crash de arranque). Las $variables aquí son puras de
#  nginx y se resuelven en cada request: $backend_origen se define con set
#  a nivel de server (nginx.spa.conf.template) y $proto_original/
#  $real_ip_original por los maps del http.
# ═══════════════════════════════════════════════════════════════════════════

proxy_pass $backend_origen;
proxy_http_version 1.1;
# SNI para upstream https; en http el nginx lo ignora.
proxy_ssl_server_name on;
# SIN proxy_set_header Host: nginx manda por defecto el host del UPSTREAM.
# Detrás de un edge que enruta por Host, mandar $host (el del SPA) puede
# devolver la petición al propio frontend → loop → 508 (fallo real
# corregido 2026-11-04). El host ORIGINAL del navegador viaja en
# X-Forwarded-Host, que es la cabecera que usa la defensa CSRF del backend
# (x-forwarded-host || host).
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $proto_original;
proxy_set_header X-Real-IP         $real_ip_original;
# Subidas grandes (Fase 4-2): sin buffering en disco del proxy y timeout
# amplio para la cadena borde→SPA→backend.
proxy_request_buffering off;
proxy_read_timeout 120s;
