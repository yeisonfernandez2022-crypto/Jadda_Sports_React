name: CI - JADDA SPORTS

on:
  push:
    branches: [main, develop, Develop]
  pull_request:
    branches: [main, develop, Develop]
  workflow_dispatch:

# Cancela las corridas obsoletas cuando se hace push en serie sobre la
# misma rama (ahorra minutos de Actions: solo corre la última).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12'
  # Contraseña efímera SOLO para el MySQL del runner (no es un secreto real)
  MYSQL_ROOT_PASSWORD: jadda_ci_root
  # Desactivar rate limiter en CI para tests E2E
  DISABLE_RATE_LIMIT: 'true'

jobs:
  # ============================================================
  # LINT & TYPE CHECK (frontend). El backend es JavaScript puro.
  # ============================================================
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Link tests to frontend node_modules
        run: ln -s "$(pwd)/frontend/node_modules" "$(pwd)/tests/frontend/node_modules"

      - name: TypeScript check (frontend)
        run: pnpm --prefix frontend exec tsc -b

      - name: TypeScript check of tests (frontend)
        run: pnpm --prefix frontend run typecheck:tests

      - name: Lint (frontend)
        run: pnpm --prefix frontend lint

  # ============================================================
  # BACKEND UNIT TESTS (mocks de MySQL, sin base de datos)
  # ============================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      # Los tests viven en la raíz tests/ — sin este symlink los imports
      # (express, supertest...) no resuelven node_modules desde tests/backend/
      - name: Link tests to backend node_modules
        run: ln -s "$(pwd)/backend/node_modules" "$(pwd)/tests/backend/node_modules"

      - name: Run backend unit tests with coverage
        run: pnpm --prefix backend test:coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================
  # BACKEND INTEGRATION TESTS (MySQL real en Docker)
  # ============================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3307:3306
        # OJO: services.*.options NO admite el contexto `env` (GitHub rechaza el
        # workflow completo con 0 jobs). La contraseña es un literal efímero del
        # runner (no es un secreto) — se in-linea en el health-cmd.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pjadda_ci_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      # Tests viven en la raíz tests/ (imports bare → symlink)
      - name: Link tests to backend node_modules
        run: ln -s "$(pwd)/backend/node_modules" "$(pwd)/tests/backend/node_modules"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -u root -pjadda_ci_root --silent; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no arrancó"
          exit 1

      - name: Run backend integration tests
        env:
          USE_CI_MYSQL: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: jadda_sports_test
        run: pnpm --prefix backend test:integration

      - name: Upload backend integration coverage
        # El job cobertura-backend fusiona este JSON con el de unitarias
        # (script backend/scripts/cobertura-combinada.mjs) — sin artefacto
        # la fusión muere con "No existe el reporte de cobertura de integración".
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-integration
          path: backend/coverage-integration/
          retention-days: 7

  # ============================================================
  # FRONTEND UNIT & COMPONENT TESTS
  # ============================================================
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      # Tests centralizados en la raíz tests/ (imports bare → symlink)
      - name: Link tests to frontend node_modules
        run: ln -s "$(pwd)/frontend/node_modules" "$(pwd)/tests/frontend/node_modules"

      - name: Run frontend tests with coverage
        run: pnpm --prefix frontend test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================================
  # ANÁLISIS DE DEPENDENCIAS (pnpm audit) — informativo
  # Política: con continue-on-error NO bloquea el build (muchos avisos son
  # transitivos sin fix disponible; un bloqueo automático generaría falsos
  # negativos del pipeline). Los hallazgos high/critical productivos se
  # revisan en cada release (ver docs/auditoria/estado-brechas.md).
  # ============================================================
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Audit backend (prod deps, high+)
        run: pnpm --prefix backend audit --prod --audit-level high

      - name: Audit frontend (prod deps, high+)
        run: pnpm --prefix frontend audit --prod --audit-level high

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, backend-integration-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Syntax check backend
        run: |
          cd backend
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './tests/*' \
            -not -name '*.test.js' \
            -print0 | xargs -0 -n1 node --check

  # ============================================================
  # BUILD DE LAS IMÁGENES DE PRODUCCIÓN (no publica nada)
  # Verifica que ambos Dockerfile.prod compilan y que deploy/compose.prod.yaml
  # es un YAML válido con sus variables `:?` satisfacibles. Nada sale del
  # runner: sin push de imágenes (no hay registry) y sin secretos — las
  # variables para el render del compose son ficticias y viven SOLO en el
  # alcance de este step. restaura el flujo: corre en push (main/develop) y
  # en PR hacia main/develop, y respeta la `concurrency` global del workflow.
  # ============================================================
  build-imagenes-prod:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t jadda-backend-prod:ci ./backend

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod -t jadda-frontend-prod:ci ./frontend

      - name: Validate production compose
        env:
          MYSQL_ROOT_PASSWORD: ci-dummy
          SESSION_SECRET: ci-dummy
          DB_PASSWORD: ci-dummy
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-dummy
          MIGRATE_DB_PASSWORD: ci-dummy
        run: docker compose -f deploy/compose.prod.yaml config --quiet

  # ============================================================
  # E2E SMOKE - Playwright Official (@playwright/test)
  # ============================================================
  e2e-playwright:
    name: E2E Playwright
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pjadda_ci_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install Playwright test dependencies
        run: pnpm --prefix tests install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --prefix tests exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --prefix frontend build

      # Contraseña EFÍMERA del admin del seed (se genera en el runner con
      # openssl). El repo NO contiene contraseñas fijas; esto funciona igual
      # en PRs desde forks porque es una variable de entorno, no un secreto
      # de repositorio.
      - name: Generate ephemeral admin credential
        run: echo "CI_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_db
          SESSION_SECRET: ci_session_secret
          ADMIN_EMAIL: yeison
          ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          # Contraseña para el hash runtime de los usuarios DEMO del seed (el
          # vendedor alejandro.mendoza@vendedor.com entra con esta — sin esta
          # var el seed genera una clave aleatoria por arranque y el login del
          # vendedor del suite E2E es IMPOSIBLE).
          DEMO_PASSWORD: Vendedor123
          FRONTEND_URL: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci_google_client_id
          GOOGLE_CLIENT_SECRET: ci_google_client_secret
          NEWSLETTER_INTERVAL_HORAS: 72
          DISABLE_RATE_LIMIT: 'true'
        run: |
          cd backend
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/productos > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          VITE_PROXY_TARGET=http://127.0.0.1:5000 nohup pnpm preview --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "El preview no arrancó:"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright E2E tests
        env:
          API_URL: http://127.0.0.1:5000
          WEB_URL: http://127.0.0.1:5173
          ADMIN_EMAIL: yeison
          ADMIN_PASS: ${{ env.CI_ADMIN_PASSWORD }}
          VENDOR_EMAIL: alejandro.mendoza@vendedor.com
          VENDOR_PASS: Vendedor123
        # Solo chromium: el runner ubuntu-latest no trae Microsoft Edge preinstalado y
        # `playwright install chromium` no cubre el channel msedge (el proyecto msedge
        # se sigue probando en local, donde el navegador existe).
        run: pnpm --prefix tests exec playwright test --config playwright.config.ts --project=chromium

      - name: Log del backend en fallo (el /tmp/backend.log muere con el runner)
        if: failure()
        run: |
          echo "===== ÚLTIMAS 200 LÍNEAS DEL BACKEND ====="
          tail -n 200 /tmp/backend.log 2>/dev/null || echo "(no existe /tmp/backend.log)"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 7

  # ============================================================
  # EVIDENCIA INDIVIDUAL (bootcamp testing ADSO, semana 2+):
  # commits de TEST por integrante desde el inicio del trimestre. Aparece en
  # el RESUMEN de cada run (Actions → run → arriba). La matriz de rotación
  # del proyecto documenta qué capa trabajó cada quien por semana.
  # ============================================================
  evidencia-individual:
    name: Evidencia Individual (commits de test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Resumen de commits de test por integrante
        run: |
          INICIO="${{ vars.BOOTCAMP_INICIO || '2026-11-01' }}"
          echo "### 📊 Evidencia individual — commits de test desde $INICIO" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="$INICIO" HEAD -- '*tests/*' '*.test.*' '*e2e/*' || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Muestra también en el log para la corrida local
          git shortlog -sn --since="$INICIO" HEAD -- '*tests/*' '*.test.*' '*e2e/*'

  # ============================================================
  # COBERTURA COMBINADA (bootcamp testing ADSO, gate de la semana 9):
  # fusiona la cobertura de las suites UNITARIA + INTEGRACIÓN (los
  # controladores se ejercitan de verdad con MySQL real) y verifica el
  # umbral. Los reportes suben como artefactos desde los jobs previos.
  # ============================================================
  cobertura-backend:
    name: Cobertura Backend (unit + integración)
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Descarga de reportes de cobertura
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: '*coverage*'
          merge-multiple: false

      - name: Ubica los JSON y fusiona con el umbral
        env:
          # Trinquete de cobertura: la variable del repo COBERTURA_UMBRAL
          # empieza en 60 y se sube hacia 80 a medida que crece la suite.
          # (El umbral fijo 80 dejaría el CI rojo desde el día 1.)
          UMBRAL: ${{ vars.COBERTURA_UMBRAL || '60' }}
        run: |
          mkdir -p backend/coverage backend/coverage-integration
          cp backend-coverage/coverage-final.json backend/coverage/coverage-final.json 2>/dev/null || true
          # upload-artifact v4 zipea relativo al ancestro común: el artefacto
          # de integración descarga PLANO (backend-coverage-integration/coverage-final.json)
          cp backend-coverage-integration/coverage-final.json backend/coverage-integration/coverage-final.json 2>/dev/null || \
            find backend-coverage-integration -name coverage-final.json -exec cp {} backend/coverage-integration/coverage-final.json \; || true
          node backend/scripts/cobertura-combinada.mjs "$UMBRAL"

  # ============================================================
  # LEGACY E2E SMOKE (tests/smoke.mjs + playwright-core) - opcional
  # ============================================================
  e2e-smoke:
    name: E2E Smoke (Legacy)
    # Solo manual (Actions → Run workflow): duplica la cobertura de
    # e2e-playwright y es el job más caro (MySQL + build + navegador).
    # Ver docs/auditoria/estado-brechas.md (hallazgo: doble job E2E).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pjadda_ci_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install smoke test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Build frontend
        run: pnpm --prefix frontend build

      # Contraseña EFÍMERA del admin del seed (openssl en el runner). El repo
      # NO contiene contraseñas fijas.
      - name: Generate ephemeral admin credential
        run: echo "CI_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_db
          SESSION_SECRET: ci_session_secret
          ADMIN_EMAIL: yeison
          ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          # Contraseña para el hash runtime de los usuarios DEMO del seed (el
          # vendedor alejandro.mendoza@vendedor.com entra con esta — sin esta
          # var el seed genera una clave aleatoria por arranque y el login del
          # vendedor del suite E2E es IMPOSIBLE).
          DEMO_PASSWORD: Vendedor123
          FRONTEND_URL: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci_google_client_id
          GOOGLE_CLIENT_SECRET: ci_google_client_secret
          NEWSLETTER_INTERVAL_HORAS: 72
          DISABLE_RATE_LIMIT: 'true'
        run: |
          cd backend
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/productos > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          VITE_PROXY_TARGET=http://127.0.0.1:5000 nohup pnpm preview --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "El preview no arrancó:"
          cat /tmp/frontend.log
          exit 1

      - name: Run smoke suite (playwright-core)
        env:
          API_URL: http://127.0.0.1:5000
          WEB_URL: http://127.0.0.1:5173
        run: node tests/smoke.mjs