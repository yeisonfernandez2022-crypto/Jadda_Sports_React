name: CI - JADDA SPORTS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12'
  # Contraseña efímera SOLO para el MySQL del runner (no es un secreto real)
  MYSQL_ROOT_PASSWORD: jadda_ci_root

jobs:
  # ============================================================
  # LINT & TYPE CHECK (frontend). El backend es JavaScript puro.
  # ============================================================
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: TypeScript check (frontend)
        run: pnpm --prefix frontend exec tsc -b

      - name: Lint (frontend)
        run: pnpm --prefix frontend lint

  # ============================================================
  # BACKEND UNIT TESTS (mocks de MySQL, sin base de datos)
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Run backend tests with coverage
        run: pnpm --prefix backend test:coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================
  # FRONTEND UNIT & COMPONENT TESTS
  # ============================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: pnpm --prefix frontend test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Syntax check backend
        run: |
          cd backend
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './tests/*' \
            -not -name '*.test.js' \
            -print0 | xargs -0 -n1 node --check

  # ============================================================
  # E2E SMOKE (tests/smoke.mjs + Playwright Core)
  # ============================================================
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install smoke test dependencies
        run: npm ci --prefix tests

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_db
          SESSION_SECRET: ci_session_secret
          ADMIN_EMAIL: yeison
          ADMIN_PASSWORD: Losquiero7
          FRONTEND_URL: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci_google_client_id
          GOOGLE_CLIENT_SECRET: ci_google_client_secret
          FACEBOOK_CLIENT_ID: ci_facebook_client_id
          FACEBOOK_CLIENT_SECRET: ci_facebook_client_secret
          NEWSLETTER_INTERVAL_HORAS: 72
        run: |
          cd backend
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/productos > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          VITE_PROXY_TARGET=http://127.0.0.1:5000 nohup pnpm preview --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "El preview no arrancó:"
          cat /tmp/frontend.log
          exit 1

      - name: Install Chromium for Playwright Core (opcional)
        run: |
          cd tests
          npx --no-install playwright-core install chromium --with-deps || \
            echo "Descarga no disponible: se usará Google Chrome del runner"

      - name: Run smoke suite
        env:
          API_URL: http://127.0.0.1:5000
          WEB_URL: http://127.0.0.1:5173
        run: node tests/smoke.mjs

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "===== BACKEND ====="
          tail -200 /tmp/backend.log || true
          echo "===== FRONTEND ====="
          tail -100 /tmp/frontend.log || true
