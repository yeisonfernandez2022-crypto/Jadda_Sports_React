name: CI - JADDA SPORTS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela las corridas obsoletas cuando se hace push en serie sobre la
# misma rama (ahorra minutos de Actions: solo corre la última).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12'
  # Contraseña efímera SOLO para el MySQL del runner (no es un secreto real)
  MYSQL_ROOT_PASSWORD: jadda_ci_root
  # Desactivar rate limiter en CI para tests E2E
  DISABLE_RATE_LIMIT: 'true'

jobs:
  # ============================================================
  # LINT & TYPE CHECK (frontend). El backend es JavaScript puro.
  # ============================================================
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: TypeScript check (frontend)
        run: pnpm --prefix frontend exec tsc -b

      - name: Lint (frontend)
        run: pnpm --prefix frontend lint

  # ============================================================
  # BACKEND UNIT TESTS (mocks de MySQL, sin base de datos)
  # ============================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Run backend unit tests with coverage
        run: pnpm --prefix backend test:coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================
  # BACKEND INTEGRATION TESTS (MySQL real en Docker)
  # ============================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent; then
              echo "MySQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no arrancó"
          exit 1

      - name: Run backend integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3307'
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: jadda_sports_test
        run: pnpm --prefix backend vitest run --config vitest.integration.config.mjs

  # ============================================================
  # FRONTEND UNIT & COMPONENT TESTS
  # ============================================================
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Run frontend tests with coverage
        run: pnpm --prefix frontend test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================================
  # ANÁLISIS DE DEPENDENCIAS (pnpm audit) — informativo
  # Política: con continue-on-error NO bloquea el build (muchos avisos son
  # transitivos sin fix disponible; un bloqueo automático generaría falsos
  # negativos del pipeline). Los hallazgos high/critical productivos se
  # revisan en cada release (ver docs/auditoria/estado-brechas.md).
  # ============================================================
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Audit backend (prod deps, high+)
        run: pnpm --prefix backend audit --prod --audit-level high

      - name: Audit frontend (prod deps, high+)
        run: pnpm --prefix frontend audit --prod --audit-level high

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, backend-integration-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Syntax check backend
        run: |
          cd backend
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './tests/*' \
            -not -name '*.test.js' \
            -print0 | xargs -0 -n1 node --check

  # ============================================================
  # E2E SMOKE - Playwright Official (@playwright/test)
  # ============================================================
  e2e-playwright:
    name: E2E Playwright
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install Playwright test dependencies
        run: pnpm --prefix tests install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --prefix tests exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_db
          SESSION_SECRET: ci_session_secret
          ADMIN_EMAIL: yeison
          ADMIN_PASSWORD: Losquiero7
          FRONTEND_URL: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci_google_client_id
          GOOGLE_CLIENT_SECRET: ci_google_client_secret
          FACEBOOK_CLIENT_ID: ci_facebook_client_id
          FACEBOOK_CLIENT_SECRET: ci_facebook_client_secret
          NEWSLETTER_INTERVAL_HORAS: 72
          DISABLE_RATE_LIMIT: 'true'
        run: |
          cd backend
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/productos > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          VITE_PROXY_TARGET=http://127.0.0.1:5000 nohup pnpm preview --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "El preview no arrancó:"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright E2E tests
        env:
          API_URL: http://127.0.0.1:5000
          WEB_URL: http://127.0.0.1:5173
          ADMIN_EMAIL: yeison
          ADMIN_PASS: Losquiero7
          VENDOR_EMAIL: alejandro.mendoza@vendedor.com
          VENDOR_PASS: Vendedor123
        run: pnpm --prefix tests exec playwright test --config playwright.config.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 7

  # ============================================================
  # LEGACY E2E SMOKE (tests/smoke.mjs + playwright-core) - opcional
  # ============================================================
  e2e-smoke:
    name: E2E Smoke (Legacy)
    # Solo manual (Actions → Run workflow): duplica la cobertura de
    # e2e-playwright y es el job más caro (MySQL + build + navegador).
    # Ver docs/auditoria/estado-brechas.md (hallazgo: doble job E2E).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Install smoke test dependencies
        run: npm ci --prefix tests

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Start backend
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_db
          SESSION_SECRET: ci_session_secret
          ADMIN_EMAIL: yeison
          ADMIN_PASSWORD: Losquiero7
          FRONTEND_URL: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci_google_client_id
          GOOGLE_CLIENT_SECRET: ci_google_client_secret
          FACEBOOK_CLIENT_ID: ci_facebook_client_id
          FACEBOOK_CLIENT_SECRET: ci_facebook_client_secret
          NEWSLETTER_INTERVAL_HORAS: 72
          DISABLE_RATE_LIMIT: 'true'
        run: |
          cd backend
          nohup node server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/api/productos > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          VITE_PROXY_TARGET=http://127.0.0.1:5000 nohup pnpm preview --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Preview listo"
              exit 0
            fi
            sleep 2
          done
          echo "El preview no arrancó:"
          cat /tmp/frontend.log
          exit 1

      - name: Run smoke suite (playwright-core)
        env:
          API_URL: http://127.0.0.1:5000
          WEB_URL: http://127.0.0.1:5173
        run: node tests/smoke.mjs