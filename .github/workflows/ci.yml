name: CI - JADDA SPORTS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (backend)
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Install dependencies (frontend)
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: TypeScript check (backend)
        run: pnpm --prefix backend exec tsc --noEmit

      - name: TypeScript check (frontend)
        run: pnpm --prefix frontend exec tsc -b

      - name: Lint (frontend)
        run: pnpm --prefix frontend lint

  # ============================================================
  # BACKEND UNIT & INTEGRATION TESTS
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" --silent; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done

      - name: Setup test database
        run: |
          mysql -h 127.0.0.1 -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS jadda_sports_test;"
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}

      - name: Run backend tests
        run: pnpm --prefix backend test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_NAME: jadda_sports_test
          NODE_ENV: test
          SESSION_SECRET: test_session_secret
          EMAIL_USER: test@test.com
          EMAIL_PASS: test_pass
          GOOGLE_CLIENT_ID: test_google_client_id
          GOOGLE_CLIENT_SECRET: test_google_client_secret
          FACEBOOK_CLIENT_ID: test_fb_client_id
          FACEBOOK_CLIENT_SECRET: test_fb_client_secret
          FRONTEND_URL: http://localhost:5173
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: test123
          NEWSLETTER_INTERVAL_HORAS: 72

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================
  # FRONTEND UNIT & COMPONENT TESTS
  # ============================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --prefix frontend test

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================================
  # COVERAGE GATE
  # ============================================================
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Check backend coverage thresholds
        run: |
          cd backend
          # Extract coverage from JSON report
          if [ -f coverage/coverage-summary.json ]; then
            STMT=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            BRANCH=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            FUNC=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            LINE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            
            echo "Backend Coverage: Stmts=$STMT% Branches=$BRANCH% Funcs=$FUNC% Lines=$LINE%"
            
            # Thresholds from vitest config (30% for backend)
            THRESHOLD=30
            if (( $(echo "$STMT < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$BRANCH < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$FUNC < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$LINE < $THRESHOLD" | bc -l) )); then
              echo "::error::Backend coverage below threshold ($THRESHOLD%)"
              exit 1
            fi
          else
            echo "::warning::Backend coverage summary not found"
          fi

      - name: Check frontend coverage thresholds
        run: |
          cd frontend
          if [ -f coverage/coverage-summary.json ]; then
            STMT=$(jq '.total.statements.pct' coverage/coverage-summary.json)
            BRANCH=$(jq '.total.branches.pct' coverage/coverage-summary.json)
            FUNC=$(jq '.total.functions.pct' coverage/coverage-summary.json)
            LINE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
            
            echo "Frontend Coverage: Stmts=$STMT% Branches=$BRANCH% Funcs=$FUNC% Lines=$LINE%"
            
            # Thresholds from vitest config (40% for frontend)
            THRESHOLD=40
            if (( $(echo "$STMT < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$BRANCH < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$FUNC < $THRESHOLD" | bc -l) )) || \
               (( $(echo "$LINE < $THRESHOLD" | bc -l) )); then
              echo "::error::Frontend coverage below threshold ($THRESHOLD%)"
              exit 1
            fi
          else
            echo "::warning::Frontend coverage summary not found"
          fi

  # ============================================================
  # E2E TESTS (PLAYWRIGHT)
  # ============================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: jadda_sports_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${{ env.MYSQL_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install all dependencies
        run: |
          pnpm --prefix backend install --frozen-lockfile
          pnpm --prefix frontend install --frozen-lockfile
          pnpm --prefix tests install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" --silent; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done

      - name: Setup database
        run: |
          mysql -h 127.0.0.1 -u root -p"${{ env.MYSQL_ROOT_PASSWORD }}" -e "CREATE DATABASE IF NOT EXISTS jadda_sports_db;"
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}

      - name: Build frontend
        run: pnpm --prefix frontend build
        env:
          MODE: preview

      - name: Start backend
        run: |
          cd backend
          nohup node server.js > backend.log 2>&1 &
          sleep 5
          curl -f http://localhost:5000/api/productos || exit 1

      - name: Start frontend preview
        run: |
          cd frontend
          nohup pnpm preview --host --port 5173 > frontend.log 2>&1 &
          sleep 5
          curl -f http://localhost:5173 || exit 1

      - name: Install Playwright browsers
        run: |
          cd tests
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd tests
          API_URL=http://localhost:5000 WEB_URL=http://localhost:5173 \
          ADMIN_EMAIL=yeison ADMIN_PASS=Losquiero7 \
          VENDOR_EMAIL=prueba.vendedor@test.com VENDOR_PASS=Prueba123 \
          node smoke.mjs

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/trace/
          retention-days: 7

  # ============================================================
  # BUILD VERIFICATION
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install all dependencies
        run: |
          pnpm --prefix backend install --frozen-lockfile
          pnpm --prefix frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --prefix frontend build

      - name: Verify backend starts
        run: |
          cd backend
          timeout 10 node server.js || true
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: wrong_password
          DB_NAME: jadda_sports_db
          NODE_ENV: test