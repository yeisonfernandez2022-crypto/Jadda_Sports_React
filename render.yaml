#
# ═══════════════════════════════════════════════════════════════════════════
#  render.yaml — BLUEPRINT de despliegue en nube gratuita (entregable S04, 5.3)
# ═══════════════════════════════════════════════════════════════════════════
#  Proveedor: Render (web services Docker, plan free). La base de datos
#  gestionada NO se declara aquí: es un MySQL externo (Aiven MySQL Free,
#  cuenta avnadmin, TLS forzado) cuyos datos se pegan a mano la PRIMERA vez
#  (Render pide los valores sync:false en el Dashboard antes de crear nada).
#
#  Topología ESPECIAL de PaaS (difiere del compose Linux):
#   • El frontend es un SEGUNDO web service Docker (nginx interno que viaja
#     dentro de la imagen, frontend/nginx.spa.conf.template + envsubst) y
#     hace de proxy /api,/images → backend. El porqué: el front usa ~200
#     fetch("/api/...") RELATIVOS (misma-origen obligatoria: cookies de
#     sesión y CORS/CSRF) — un Static Site forzaría CORS/dominios cruzados.
#   • En Render los servicios Docker escuchan en PORT=10000 (Render lo
#     fija) y se alcanzan entre sí por NOMBRE DE SERVICIO (DNS interno).
#
#  El webhook de Wompi apunta a la URL PÚBLICA del backend:
#    https://jadda-backend.onrender.com/api/pagos/webhook
#
#  Alta manual (una vez): Render → New → Blueprint → repo → completar los
#  prompts sync:false (BD de Aiven, correo admin) → Apply.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────── API (Express/node:22) ──────────────────────
  # — No publica puertos manualmente: en Render cada web service Docker que
  #   escucha en PORT queda expuesto públicamente en su https://<nombre>.onrender.com.
#  — Migraciones: en PaaS NO hay proceso sidecar `migrate`, así que el
#   backend corre la DDL al arrancar con RUN_MIGRATIONS_ON_BOOT=true
#   (gate de backend/utils/arranque.js). Por eso DB_USER debe ser una
#   cuenta CON privilegios DDL (avnadmin), no un usuario DML-only.
  # — Healthcheck PROPIO /health (sonda del stack dev) → Render reinicia
  #   si el API deja de contestar 200.
  # — TLS de la BD (Aiven): DB_SSL=true + DB_SSL_CA (sync:false, el PEM
  #   completo del raíz ca.pem de Aiven). Sin CA el canal cifra igual
  #   (aviso en logs) — escape hatch documentado en backend/.env.example.
  - type: web
    name: jadda-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: backend
    plan: free
    # Plan free: 512 MB RAM y auto-sueño tras ~15 min sin tráfico — la 1ª
    # visita tras el sueño tarda ~1 min (latido documentado en el S04).
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_DATA
        value: "false"                      # sin cuentas/ventas de demostración
      - key: TZ
        value: America/Bogota
      # BD MySQL gestionada en Aiven (creada ANTES del despliegue):
      - key: DB_HOST                        # p. ej. pg-…db.ondigitalocean…
        sync: false                         # Aiven host completo
      - key: DB_PORT                        # Aiven: puerto propio (p. ej. 20013)
        sync: false
      - key: DB_USER                        # Aiven: avnadmin (necesita DDL)
        sync: false
      - key: DB_PASSWORD                    # Aiven: la contraseña de su cuenta
        sync: false
      - key: DB_NAME
        sync: false                         # Aiven: defaultdb (o el nombre que creó)
      - key: DB_SSL
        value: "true"                       # Aiven exige TLS
      - key: DB_SSL_CA                      # PEM del CA raíz de Aiven
        sync: false
      # PaaS sin sidecar `migrate`: la DDL corre al arrancar el backend
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      # Sesión de login (cookie connect.sid): generado una vez por Render
      - key: SESSION_SECRET
        generateValue: true
      # Cuenta admin que siembra la 1ª corrida (producción no trae defaults)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # CORS: en Render todo va same-origin (el front proxia /api) → vacío
      - key: CORS_ORIGINS
        sync: false
      # Cadena de proxys hasta el backend en Render: edge de Render → nginx
      # interno del SPA → edge de Render (backend) = 2 saltos. Con 1 (default
      # prod) req.ip sería la IP del nginx del SPA y TODO el tráfico del SPA
      # compartiría el mismo cubo del rate limiter.
      - key: TRUST_PROXY
        value: "2"
      # ── Integraciones opcionales (vacío = feature apagada, igual que dev) ──
      - key: EMAIL_USER                     # SMTP real (correos de compra/OTP)
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_URL                 # medios persistentes (uploads)
        sync: false
      # Pasarela Wompi sandbox (sin estas llaves el checkout queda en modo
      # simulado con tarjeta, como en dev sin pasarela)
      - key: PAYMENT_GATEWAY
        value: "wompi"
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false

  # ──────────────────── SPA (Vite dist servido por nginx) ────────────────
  # — La MISMA imagen también sirve en el compose Linux: el nginx interno
  #   vive en la imagen (template + envsubst) y sus variables de entorno
  #   (PORT/BACKEND_ORIGEN/DNS_RESOLVER) deciden a quién proxea.
  # — En Render: escucha PORT=10000 y proxea a la URL PÚBLICA del backend.
  #   proxy_pass con VARIABLE + resolver → nginx NO resuelve nada al
  #   arrancar: si el backend está desplegándose o dormido (plan free), el
  #   SPA vive igual y /api responde 502 temporal (con upstream estático el
  #   contenedor moría con "host not found in upstream").
  - type: web
    name: jadda-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile.prod
    dockerContext: frontend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_ORIGEN
        value: https://jadda-backend.onrender.com
      - key: DNS_RESOLVER
        value: 1.1.1.1
