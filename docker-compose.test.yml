version: '3.8'

services:
  database-test:
    image: mysql:8.0
    container_name: jadda_mysql_test
    restart: unless-stopped

    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --innodb-buffer-pool-size=128M --default-time-zone=-05:00

    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: jadda_sports_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      TZ: America/Bogota

    ports:
      - "3307:3306"

    volumes:
      - mysql_test_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -ptest_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_test_data: