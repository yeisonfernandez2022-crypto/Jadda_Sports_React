allowBuilds:
  '@scarf/scarf': false
# Settings de pnpm para el backend (pnpm >= 10 ya no lee `pnpm` en package.json).
# Overrides de seguridad (audit 2026-11-09, fusiona los de la auditoría previa):
# - uuid <11.1.1  → GHSA-w5hq-g745-h8pq (bounds check en v3/v5/v6 con buf)
# - qs <6.16.1    → GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g / GHSA-6pq8-jhm2-2vcw
# - brace-expansion <1.1.21 / <2.1.7 → GHSA-q2hr-2g5m-vwhr (ReDoS; los pins
#   viejos 1.1.20/2.1.6 quedaron DENTRO del rango vulnerable)
# - mysql2 <3.23.1 → GHSA-3f6p-5ww8-9rcr (HIGH: downgrade a mysql_clear_password)
#   + GHSA-rgwj-5xj2-c3m3 (zlib-bomb DoS) — via mysql2 anidado de express-mysql-session.
# - proxy-addr / body-parser: hallazgos de la auditoría previa (conservados).
overrides:
  uuid: ^11.1.1
  qs: 6.17.1
  "brace-expansion@<2": ^1.1.21
  "brace-expansion@2": ^2.1.7
  mysql2: ^3.23.1
  proxy-addr: '>=2.0.8'
  body-parser: '>=2.4.0'
